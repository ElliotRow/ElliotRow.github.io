    <input id="check01" type="checkbox" name="Galleries" />
    <label for="check01"><b>Portfolios ▽ </b></label>

    <ul class="submenu">
        <li><a href="https://elliotrow.github.io/Webpages/Coding Portfolio.html">Coding Portfolio</a></li>

<main>
    <iframe
            src="https://docs.google.com/gview?embedded=true&url=https://elliotrow.github.io/Images/Elliot%20Rowberry%20CV.pdf"
            style="border: none; width: 80vw; max-width: 90%; height: 100%;"
    ></iframe>

</main>


<script>
    //save the menu being open so it doesn't close every time you switch pages
    const checkbox = document.getElementById("check01");
    const saved = localStorage.getItem("submenuOpen");
    if (saved === "true") {
        checkbox.checked = true;
    }

    // save state whenever it changes
    checkbox.addEventListener("change", () => {
        localStorage.setItem("submenuOpen", checkbox.checked);
    });

    //Resizing the pdf so its actually visable on mobile
    function resizePDF() {
    const iframe = document.querySelector("iframe");
    
    //check if its mobile and adjust how it resizes according to if it is or not
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    if (isMobile) {
        // mobile uses innerHeight to avoid top-bar clipping
        iframe.style.height = window.innerHeight + "px";
    } else {
        // desktop browsers use full viewport height
        iframe.style.height = "100vh";
    }
    }

    window.addEventListener("resize", resizePDF);
    window.addEventListener("orientationchange", resizePDF);
    resizePDF();
</script>

</html>
